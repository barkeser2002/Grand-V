<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FiveWeb · Hata</title>
  <style>
    html,body{margin:0;height:100%;background:#15161a;color:#f3efe9;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
    main{min-height:100%;display:grid;place-content:center;gap:14px;padding:24px;text-align:center;box-sizing:border-box}
    .mark{width:56px;height:56px;margin:0 auto;border-radius:14px;background:#ff7a1a;color:#15161a;font-weight:800;display:grid;place-items:center;font-size:20px}

    p{margin:0;color:#b9b2a8;max-width:42ch;margin-inline:auto}
    a.btn{display:inline-block;margin-top:8px;padding:12px 22px;border-radius:10px;background:#ff7a1a;color:#15161a;font-weight:700;text-decoration:none}
    a.btn:focus-visible{outline:3px solid #ffb37a;outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">FW</div>
    <h1>FiveWeb beklenmeyen bir hatayla durdu</h1>
    <p>Uygulamayı kapatıp yeniden açın. Sorun sürerse FiveWeb sayfasını yenileyin.</p>
    <a class="btn" href="https://fiveweb.royalnetwork.xyz/">Ana sayfaya dön</a>
  </main>
</body>
</html>
